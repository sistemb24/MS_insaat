name: Production R2 Temporary Credential Protocol Diagnostic

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type production-r2-temp-credential-protocol-diagnostic
        required: true
        type: string
      expected_sha:
        description: Exact main commit SHA approved for the read-only diagnostic
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: noa-production-r2-temp-credential-protocol-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'production-r2-temp-credential-protocol-diagnostic' &&
      inputs.expected_sha == github.sha
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NOA_EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}
      NOA_PRODUCTION_R2_TEMPORARY_CREDENTIAL_PROTOCOL_DIAGNOSTIC_CONFIRMATION: ${{ inputs.confirmation }}
      NOA_RELEASE_ID: ${{ github.sha }}
      NOA_RUNTIME_ENV: production
      NOA_SOURCE_REF: ${{ github.ref }}
      PRODUCTION_DELETION_JOURNAL_R2_BUCKET: ${{ vars.PRODUCTION_DELETION_JOURNAL_R2_BUCKET }}
      PRODUCTION_DELETION_JOURNAL_R2_ENDPOINT: ${{ vars.PRODUCTION_DELETION_JOURNAL_R2_ENDPOINT }}
      PRODUCTION_DELETION_JOURNAL_R2_PARENT_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_DELETION_JOURNAL_R2_PARENT_ACCESS_KEY_ID }}
      PRODUCTION_DELETION_JOURNAL_R2_PARENT_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_DELETION_JOURNAL_R2_PARENT_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compare aws4fetch and AWS SDK v3 with one read-only temporary credential
        run: pnpm exec tsx scripts/diagnose-production-r2-temporary-credential-protocol.ts
