name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: noa_ci
          POSTGRES_PASSWORD: noa_ci
          POSTGRES_USER: noa_ci
        options: >-
          --health-cmd "pg_isready -U noa_ci -d noa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://noa_ci:noa_ci@127.0.0.1:5432/noa_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm type-check
      - run: pnpm lint --max-warnings=0
      - run: pnpm build
