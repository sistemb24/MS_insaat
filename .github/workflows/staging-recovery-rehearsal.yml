name: Staging Recovery Rehearsal

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type staging-recovery to run migration and isolated restore
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: noa-staging-backup
  cancel-in-progress: false

jobs:
  recovery:
    if: ${{ inputs.confirmation == 'staging-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      NOA_RELEASE_ID: ${{ github.sha }}
      NOA_RUNTIME_ENV: staging
      NOA_STAGING_RECOVERY_FIXTURE_CONFIRMATION: staging-recovery-fixture
      R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_READ_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_READ_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.STAGING_R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.STAGING_R2_ENDPOINT }}
      R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_BACKUP_ACCESS_KEY_ID }}
      R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_BACKUP_SECRET_ACCESS_KEY }}
      R2_BACKUP_BUCKET: ${{ vars.STAGING_R2_BACKUP_BUCKET }}
      R2_BACKUP_ENDPOINT: ${{ vars.STAGING_R2_BACKUP_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Apply staging migrations
        run: pnpm db:migrate
      - name: Verify staging recovery source
        run: pnpm staging:recovery:preflight
      - name: Remove stale synthetic database fixture
        run: pnpm staging:recovery:fixture:cleanup
      - name: Create synthetic database fixture
        run: pnpm staging:recovery:fixture:create
      - name: Create post-migration backup
        run: pnpm staging:backup:create
      - name: Verify post-migration backup
        run: pnpm staging:backup:verify
      - name: Restore into isolated database and namespace
        run: pnpm staging:recovery:restore
      - name: Remove synthetic database fixture
        if: ${{ always() }}
        run: pnpm staging:recovery:fixture:cleanup
