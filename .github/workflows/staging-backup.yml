name: Staging Backup

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the latest committed backup without creating a new one
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: noa-staging-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      NOA_RELEASE_ID: ${{ github.sha }}
      NOA_RUNTIME_ENV: staging
      R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_READ_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_READ_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.STAGING_R2_BUCKET }}
      R2_ENDPOINT: ${{ vars.STAGING_R2_ENDPOINT }}
      R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_BACKUP_ACCESS_KEY_ID }}
      R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_BACKUP_SECRET_ACCESS_KEY }}
      R2_BACKUP_BUCKET: ${{ vars.STAGING_R2_BACKUP_BUCKET }}
      R2_BACKUP_ENDPOINT: ${{ vars.STAGING_R2_BACKUP_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Create backup
        if: ${{ github.event_name == 'schedule' || !inputs.verify_only }}
        run: pnpm staging:backup:create
      - name: Verify latest backup
        run: pnpm staging:backup:verify
